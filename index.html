<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Archive Turntable — Long Playing Records</title><style>
:root{font-family:ui-monospace,Consolas,monospace;color:#1d1e20;background:#c9c9c9}*{box-sizing:border-box}body{margin:0}.shell{max-width:1100px;margin:auto;padding:16px;display:grid;grid-template-columns:minmax(300px,430px) minmax(0,1fr);gap:12px}.col{display:flex;flex-direction:column;gap:12px;min-width:0}.card{background:#e4e4e4;border-radius:26px;padding:20px}h1{font-size:1rem;text-transform:uppercase;margin:0}.muted,small{color:#666;font-size:.8rem}.status{display:flex;align-items:center;gap:18px}.dot{width:58px;height:58px;background:#aaa;border-radius:50%;display:grid;place-items:center;flex:none}.dot:after{content:"";width:13px;height:13px;border-radius:50%;background:white}.playing .dot{background:#e0202a}.lbl{text-transform:uppercase;letter-spacing:.12em;font-size:.78rem}.lbl b{display:block;margin-top:4px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.platter{width:min(100%,300px);aspect-ratio:1;border:1px solid;border-radius:50%;position:relative;margin:18px auto}.disc{position:absolute;inset:7%;border-radius:50%;background:repeating-radial-gradient(circle,#222 0 2px,#333 3px 4px);animation:spin 1.8s linear infinite;animation-play-state:paused}.playing .disc{animation-play-state:running}@keyframes spin{to{transform:rotate(360deg)}}.label{position:absolute;inset:34%;border-radius:50%;background:#bbb center/cover}.arm{position:absolute;right:0;top:0;width:2px;height:67%;background:#1d1e20;transform-origin:top;transform:rotate(14deg);transition:transform 1s}.playing .arm{transform:rotate(30deg)}.now,.time{display:flex;justify-content:space-between;gap:10px}.now b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.now{margin-top:10px}.big{font-size:1.6rem}input[type=range]{width:100%;accent-color:#1d1e20}.ctrl,.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:30px;padding:11px 16px;background:#f5f5f5;cursor:pointer;font:inherit;font-size:.78rem;text-transform:uppercase}button:hover{background:white}button:focus-visible,input:focus-visible{outline:2px solid #e0202a;outline-offset:2px}.on,.dark{background:#1d1e20;color:#fff}.on:hover,.dark:hover{background:#444}.chips button{padding:8px 12px;border:1px solid #aaa}.tracks{display:flex;gap:8px;overflow-x:auto;margin-top:14px}.tracks button{min-width:95px;max-width:95px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tracks button.current{text-decoration:underline}.tracks button:before{content:attr(data-n);display:block;font-size:1.3rem}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{min-height:160px;display:flex;flex-direction:column;justify-content:space-between}.val{font-size:1.8rem}.bar{display:flex;gap:8px;margin-top:12px}.bar input{flex:1;min-width:0;border:0;border-radius:30px;padding:12px;font:inherit}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px;margin-top:16px}.record{padding:0;border:0;background:transparent;text-align:left;min-width:0}.record .cover{display:block;width:100%;aspect-ratio:1;background:#bbb center/cover;border:1px solid;border-radius:18px}.record strong,.record small{display:block;margin:5px 4px;overflow:hidden;text-overflow:ellipsis}.record strong{font-size:.76rem}.message{grid-column:1/-1;text-align:center;padding:24px;color:#666}.hidden{display:none}@media(max-width:850px){.shell{grid-template-columns:1fr}}@media(max-width:390px){.card{padding:14px}}
</style></head><body><main class="shell"><section class="col" id="deck"><div class="card status"><div class="dot"></div><div><h1 id="status">Standby</h1><small>Long Playing Records</small></div></div><div class="card"><div class="lbl">Now playing<b id="subtitle">Pick a record</b></div><div class="platter"><div class="disc"></div><div class="label" id="label"></div><div class="arm"></div></div><div class="now"><b id="title">Drop the needle</b><span class="big" id="clock">0:00</span></div><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek"><div class="time muted"><span id="elapsed">0:00</span><span id="duration">0:00</span></div><div class="ctrl"><button id="prev" aria-label="Previous track">◀◀</button><button id="play" class="dark">▶ Play</button><button id="next" aria-label="Next track">▶▶</button></div></div><div class="card"><div class="lbl">Tracklist</div><div class="tracks" id="tracks"></div></div><div class="tiles"><div class="card tile"><div class="lbl">Track progress</div><div class="val" id="progress">0%</div></div><div class="card tile"><div class="lbl">Volume</div><div class="val" id="volpct">80%</div><input id="volume" type="range" min="0" max="1" step=".01" value=".8" aria-label="Volume"></div><div class="card tile"><div class="lbl">Crackle</div><button id="crackle" class="on" aria-pressed="true">ON</button><input id="cracklelevel" type="range" min="0" max=".3" step=".005" value=".08" aria-label="Crackle level"></div><div class="card tile"><div class="lbl">Warm tone</div><button id="warm" class="on" aria-pressed="true">ON</button></div></div><audio id="audio" crossorigin="anonymous" preload="none"></audio></section><section class="col"><div class="card"><div class="lbl">Collection<b>Long Playing Records</b></div><p class="muted">Only <a href="https://archive.org/details/album_recordings">album_recordings</a>. Favorites are not included.</p><div class="lbl" style="margin-top:18px">Genre radio<b id="genre-name">All genres</b></div><div class="chips" id="genres"></div><div class="ctrl"><button class="dark" id="shuffle">⇆ Shuffle</button><button class="on" id="auto" aria-pressed="true">Auto-play: ON</button></div></div><div class="card"><div class="lbl">Record crate<b id="count"></b></div><form id="search" class="bar"><input id="query" type="search" aria-label="Search Long Playing Records" placeholder="SEARCH LONG PLAYING RECORDS"><button class="dark">Go</button></form><div id="grid" class="grid"></div><div class="ctrl"><button id="more" class="hidden">Load more</button></div></div></section></main><script>
'use strict';
const COLLECTION='album_recordings',GENRES={'All':'','Jazz':'(jazz OR bebop OR "big band" OR swing)','Classic Rock':'("classic rock" OR "hard rock" OR "rock and roll" OR psychedelic)','Indie':'(indie OR "alternative rock" OR "lo-fi" OR "post-punk")','Country Western':'(country OR western OR bluegrass OR "honky tonk" OR cowboy)','Blues':'(blues OR delta)','Soul / R&B':'(soul OR motown OR "r&b" OR funk)','Folk':'(folk OR "singer-songwriter")','Classical':'(classical OR symphony OR orchestra OR opera)','Soundtrack':'(soundtrack OR "original cast" OR musical)','Easy Listening':'(lounge OR "easy listening" OR exotica OR "space age pop")','Holiday':'(christmas OR holiday)'};
const $=id=>document.getElementById(id),audio=$('audio'),deck=$('deck');let genre='All',page=1,tracks=[],index=0,item=null,lastId=null,auto=true,searchToken=0,loadToken=0,ctx,lowpass,shelf,noiseGain,crackleOn=true,warmOn=true;
const one=v=>Array.isArray(v)?v[0]:v;
function queryFor(text=''){const clauses=['collection:'+COLLECTION,'mediatype:audio'];if(text)clauses.push('('+text+')');if(GENRES[genre])clauses.push(GENRES[genre]);return clauses.join(' AND ')}
function url(text,rows,p){const u=new URL('https://archive.org/advancedsearch.php');u.searchParams.set('q',queryFor(text));for(const f of ['identifier','title','creator','year'])u.searchParams.append('fl[]',f);u.searchParams.set('output','json');u.searchParams.set('rows',rows);u.searchParams.set('page',p);return u}
async function get(u){const r=await fetch(u);if(!r.ok)throw Error('HTTP '+r.status);return r.json()}
function msg(text){const e=document.createElement('div');e.className='message';e.textContent=text;return e}
function record(d){const b=document.createElement('button');b.type='button';b.className='record';const cover=document.createElement('span');cover.className='cover';cover.style.backgroundImage='url("https://archive.org/services/img/'+encodeURIComponent(d.identifier)+'")';const title=document.createElement('strong');title.textContent=one(d.title)||d.identifier;const artist=document.createElement('small');artist.textContent=(one(d.creator)||'Unknown artist')+(d.year?' / '+one(d.year):'');b.append(cover,title,artist);b.onclick=()=>load(d);return b}
async function search(reset=true){const token=++searchToken,grid=$('grid');if(reset){page=1;grid.replaceChildren()}const loading=msg('Loading records…');grid.append(loading);try{const result=await get(url($('query').value.trim(),48,page));if(token!==searchToken)return;loading.remove();const docs=result.response?.docs||[];if(reset)$('count').textContent=(result.response?.numFound||0)+' records';if(!docs.length&&reset)grid.append(msg('No records found. Try another genre or search.'));grid.append(...docs.map(record));$('more').classList.toggle('hidden',docs.length<48)}catch(e){if(token===searchToken)loading.textContent='Could not reach the Archive: '+e.message}}
function setGenre(key){genre=key;$('genre-name').textContent=key==='All'?'All genres':key;$('query').value='';for(const b of $('genres').children){const active=b.dataset.key===key;b.classList.toggle('on',active);b.setAttribute('aria-pressed',String(active))}++loadToken;search();randomRecord()}
for(const key of Object.keys(GENRES)){const b=document.createElement('button');b.textContent=key;b.dataset.key=key;b.classList.toggle('on',key==='All');b.setAttribute('aria-pressed',String(key==='All'));b.onclick=()=>setGenre(key);$('genres').append(b)}
$('search').onsubmit=e=>{e.preventDefault();search()};$('more').onclick=()=>{page++;search(false)};$('shuffle').onclick=()=>randomRecord();$('auto').onclick=()=>{auto=!auto;$('auto').textContent='Auto-play: '+(auto?'ON':'OFF');$('auto').classList.toggle('on',auto);$('auto').setAttribute('aria-pressed',String(auto))};
async function randomRecord(){const token=++loadToken;$('title').textContent='Finding a record…';try{const first=await get(url('',1,1));if(token!==loadToken)return;const total=first.response?.numFound||0;if(!total){$('title').textContent='No records for this filter';return}for(let tries=0;tries<5;tries++){const start=Math.floor(Math.random()*Math.max(1,total-50))+1;const result=await get(url('',Math.min(50,total),start));if(token!==loadToken)return;let docs=(result.response?.docs||[]).filter(d=>d.identifier!==lastId);if(!docs.length)docs=result.response?.docs||[];if(docs.length&&await load(docs[Math.floor(Math.random()*docs.length)],token))return}if(token===loadToken)$('title').textContent='No playable MP3 found in sampled records'}catch(e){if(token===loadToken){$('title').textContent='Could not reach the Archive';$('subtitle').textContent=e.message}}}
async function load(d,existing){const token=existing??++loadToken;$('title').textContent='Loading…';$('subtitle').textContent=one(d.title)||d.identifier;try{const meta=await get('https://archive.org/metadata/'+encodeURIComponent(d.identifier));if(token!==loadToken)return false;let files=(meta.files||[]).filter(f=>f.name&&(/\.mp3$/i.test(f.name)||/mp3/i.test(f.format||'')));const full=files.filter(f=>!/sample/i.test(f.format||'')&&!/sample/i.test(f.name));if(full.length)files=full;const vbr=files.filter(f=>/vbr/i.test(f.format||''));if(vbr.length)files=vbr;const seen=new Set();files=files.filter(f=>{if(seen.has(f.name))return false;seen.add(f.name);return true}).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));if(!files.length){$('title').textContent='No playable MP3';$('subtitle').textContent='Try another record';return false}tracks=files;item={id:d.identifier,title:one(d.title)||d.identifier,artist:one(d.creator)||'Unknown artist'};lastId=d.identifier;$('label').style.backgroundImage='url("https://archive.org/services/img/'+encodeURIComponent(d.identifier)+'")';$('tracks').replaceChildren(...files.map((f,i)=>{const b=document.createElement('button');b.dataset.n=String(i+1).padStart(2,'0');b.textContent=f.title||f.name;b.title=b.textContent;b.onclick=()=>playTrack(i);return b}));playTrack(0);return true}catch(e){if(token===loadToken){$('title').textContent='Error loading record';$('subtitle').textContent=e.message}return false}}
function playTrack(i){if(!tracks.length||!item)return;index=(i+tracks.length)%tracks.length;const f=tracks[index];audio.src='https://archive.org/download/'+encodeURIComponent(item.id)+'/'+f.name.split('/').map(encodeURIComponent).join('/');$('title').textContent=f.title||f.name;$('subtitle').textContent=item.artist+' — '+item.title;[...$('tracks').children].forEach((b,n)=>b.classList.toggle('current',n===index));playAudio()}
async function playAudio(){try{initAudio();await ctx.resume();await audio.play()}catch(e){$('status').textContent='Playback unavailable';$('subtitle').textContent='Try Play or another record: '+e.message}}
$('play').onclick=()=>{if(!tracks.length){randomRecord();return}audio.paused?playAudio():audio.pause()};$('prev').onclick=()=>tracks.length&&playTrack(index-1);$('next').onclick=()=>tracks.length&&playTrack(index+1);
audio.onplay=()=>{deck.classList.add('playing');$('status').textContent='Playing';$('play').textContent='❚❚ Pause';setCrackle()};audio.onpause=()=>{deck.classList.remove('playing');$('status').textContent='Paused';$('play').textContent='▶ Play';setCrackle()};audio.onended=()=>{if(index<tracks.length-1)playTrack(index+1);else if(auto)randomRecord()};audio.onerror=()=>{if(audio.src){$('status').textContent='Playback error';$('subtitle').textContent='This file may be unavailable or block cross-origin audio. Try another record.'}};
const fmt=s=>Number.isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
audio.ontimeupdate=()=>{const p=Number.isFinite(audio.duration)&&audio.duration>0?audio.currentTime/audio.duration:0;$('elapsed').textContent=$('clock').textContent=fmt(audio.currentTime);$('duration').textContent=fmt(audio.duration);$('seek').value=Math.round(p*1000);$('progress').textContent=Math.round(p*100)+'%'};
$('seek').oninput=e=>{if(Number.isFinite(audio.duration)&&audio.duration>0)audio.currentTime=e.target.value/1000*audio.duration};
$('volume').oninput=()=>{audio.volume=+$('volume').value;$('volpct').textContent=Math.round(audio.volume*100)+'%'};audio.volume=.8;
function initAudio(){if(ctx)return;ctx=new (window.AudioContext||window.webkitAudioContext)();const src=ctx.createMediaElementSource(audio);shelf=ctx.createBiquadFilter();shelf.type='lowshelf';shelf.frequency.value=200;shelf.gain.value=3;lowpass=ctx.createBiquadFilter();lowpass.type='lowpass';src.connect(shelf);shelf.connect(lowpass);lowpass.connect(ctx.destination);const len=Math.round(ctx.sampleRate*4),buf=ctx.createBuffer(1,len,ctx.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*.015;for(let n=0;n<40;n++){const p=Math.floor(Math.random()*len),a=.4+Math.random()*.6;for(let k=0;k<30;k++)d[(p+k)%len]+=(Math.random()*2-1)*a*Math.exp(-k/5)}const noise=ctx.createBufferSource(),hp=ctx.createBiquadFilter();noise.buffer=buf;noise.loop=true;hp.type='highpass';hp.frequency.value=500;noiseGain=ctx.createGain();noiseGain.gain.value=0;noise.connect(hp);hp.connect(noiseGain);noiseGain.connect(ctx.destination);noise.start();setWarm();setCrackle()}
function setWarm(){if(ctx){lowpass.frequency.value=warmOn?7500:20000;shelf.gain.value=warmOn?3:0}}
function setCrackle(){if(ctx)noiseGain.gain.setTargetAtTime(crackleOn&&!audio.paused?+$('cracklelevel').value:0,ctx.currentTime,.3)}
$('crackle').onclick=()=>{crackleOn=!crackleOn;$('crackle').textContent=crackleOn?'ON':'OFF';$('crackle').classList.toggle('on',crackleOn);$('crackle').setAttribute('aria-pressed',String(crackleOn));setCrackle()};
$('warm').onclick=()=>{warmOn=!warmOn;$('warm').textContent=warmOn?'ON':'OFF';$('warm').classList.toggle('on',warmOn);$('warm').setAttribute('aria-pressed',String(warmOn));setWarm()};
$('cracklelevel').oninput=setCrackle;search();
</script></body></html>
